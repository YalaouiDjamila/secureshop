version: "3.8"

services:

  gateway:
    build: ../gateway
    ports:
      - "80:80"
    depends_on:
      - user-service
      - product-service
      - order-service

  user-service:
    build: ../services/user-service
    ports:
      - "8001:8000"

  product-service:
    build: ../services/product-service
    ports:
      - "8002:8000"

  order-service:
    build: ../services/order-service
    ports:
      - "8003:8000"