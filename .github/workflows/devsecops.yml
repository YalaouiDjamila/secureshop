name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # =========================================================
  # SBOM
  # =========================================================
  sbom:
    name: SBOM - Syft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -Lo syft.tar.gz https://github.com/anchore/syft/releases/download/v1.0.0/syft_1.0.0_linux_amd64.tar.gz
          tar -xzf syft.tar.gz
          sudo mv syft /usr/local/bin/

      - name: Generate SBOM
        run: syft dir:. -o json > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # =========================================================
  # SAST - BANDIT
  # =========================================================
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit
        run: |
          mkdir -p reports

          if [ -d "./services" ] && find ./services -name "*.py" | grep -q .; then
            bandit -r ./services -f json  -o reports/bandit-results.json  || true
            bandit -r ./services -f sarif -o reports/bandit-results.sarif || true
          else
            echo '{"results":[],"metrics":{},"errors":[],"generated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > reports/bandit-results.json
            echo '{"version":"2.1.0","runs":[]}' > reports/bandit-results.sarif
          fi

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: |
            reports/bandit-results.json
            reports/bandit-results.sarif

      - name: Upload Bandit SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/bandit-results.sarif
          category: bandit-sast

  # =========================================================
  # SCA - DEPENDENCY CHECK
  # =========================================================
  sca-dependency-check:
    name: SCA - Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Merge all requirements into one file
        run: |
          mkdir -p reports
          echo "# Combined requirements from all services" > combined-requirements.txt

          for req in services/*/requirements.txt; do
            echo "" >> combined-requirements.txt
            echo "# === $req ===" >> combined-requirements.txt
            cat "$req" >> combined-requirements.txt
          done

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SecureShop'
          path: '.'
          format: 'HTML'
          args: >
            --enableExperimental
            --out reports
            --scan combined-requirements.txt
            --enableRetired

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # =========================================================
  # SCA - PIP AUDIT
  # =========================================================
  python-sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install all dependencies
        run: find . -name "requirements.txt" -exec pip install -r {} \; 2>/dev/null || true

      - name: Run pip-audit
        run: |
          pip-audit \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-25645 \
            --ignore-vuln CVE-2025-62727 \
            || true

  # =========================================================
  # SCA - TRIVY FS
  # =========================================================
  sca-trivy:
    name: SCA - Trivy (Python Dependencies)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scan Python dependencies for CVEs
        run: |
          mkdir -p reports
          echo "=== Trivy SCA: Scanning requirements.txt files ===" > reports/trivy-sca-results.txt

          for req in services/*/requirements.txt; do
            service_name=$(echo "$req" | cut -d'/' -f2)
            echo "" >> reports/trivy-sca-results.txt
            echo "========== $service_name ==========" >> reports/trivy-sca-results.txt
            trivy fs --scanners vuln --severity HIGH,CRITICAL --format table "$req" >> reports/trivy-sca-results.txt 2>&1 || true
          done

          trivy fs --scanners vuln --severity HIGH,CRITICAL,MEDIUM --format json -o reports/trivy-sca.json . || true

      - name: Upload Trivy SCA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-results
          path: |
            reports/trivy-sca-results.txt
            reports/trivy-sca.json

  # =========================================================
  # SECRET SCANNING - GITLEAKS
  # =========================================================
  secrets-gitleaks:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          mkdir -p reports

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --no-git \
            --verbose \
            --config /repo/.gitleaks.toml \
            --report-format sarif \
            --report-path /repo/reports/gitleaks-results.sarif \
            || true

          [ -f reports/gitleaks-results.sarif ] || echo '{"version":"2.1.0","runs":[]}' > reports/gitleaks-results.sarif

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: reports/gitleaks-results.sarif

      - name: Upload Gitleaks SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/gitleaks-results.sarif
          category: gitleaks-secrets

  # =========================================================
  # SECRETS MANAGEMENT - VAULT
  # =========================================================
  secrets-vault:
    name: Secrets Management - Vault
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Start Vault Container
        run: |
          docker run -d --name vault-dev \
            --cap-add=IPC_LOCK \
            -e VAULT_DEV_ROOT_TOKEN_ID=vault-dev-token \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            -p 8200:8200 \
            hashicorp/vault:1.15
          sleep 10

      - name: Verify Vault health
        run: |
          mkdir -p reports
          {
            echo "=== HashiCorp Vault - Secrets Management ==="
            echo ""
            echo "Status: Vault Dev Mode started successfully"
            echo "Address: http://127.0.0.1:8200"
            echo "Auth Method: Token"
            echo ""
            echo "--- Vault Health Check ---"
            curl -s http://127.0.0.1:8200/v1/sys/health
            echo ""
          } > reports/vault-results.txt

      - name: Store secrets
        run: |
          curl -s \
            --header "X-Vault-Token: vault-dev-token" \
            --request POST \
            --data '{"data":{"JWT_SECRET":"test-key","DB_PASSWORD":"test-pass"}}' \
            http://127.0.0.1:8200/v1/secret/data/secureshop/user-service

      - name: Retrieve secrets
        run: |
          {
            echo ""
            echo "--- Secrets Retrieved ---"
            curl -s \
              --header "X-Vault-Token: vault-dev-token" \
              http://127.0.0.1:8200/v1/secret/data/secureshop/user-service
          } >> reports/vault-results.txt

      - name: Upload Vault Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-results
          path: reports/vault-results.txt

      - name: Cleanup
        if: always()
        run: docker stop vault-dev && docker rm vault-dev

  # =========================================================
  # CONTAINER SCANNING - TRIVY
  # =========================================================
  container-trivy:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Build Docker images
        run: docker compose -f infrastructure/docker-compose.yml build

      - name: Scan Docker images (TXT report)
        run: |
          mkdir -p reports/sarif-parts
          echo "=== TRIVY CONTAINER SCAN REPORT ===" > reports/trivy-container-results.txt

          for img in \
            secureshop-user-service \
            secureshop-product-service \
            secureshop-order-service \
            secureshop-payment-service \
            secureshop-notification-service \
            secureshop-inventory-service \
            secureshop-gateway; do

            echo "" >> reports/trivy-container-results.txt
            echo "==============================" >> reports/trivy-container-results.txt
            echo "Scanning: $img" >> reports/trivy-container-results.txt
            echo "==============================" >> reports/trivy-container-results.txt

            trivy image --severity HIGH,CRITICAL --no-progress --format table "$img" >> reports/trivy-container-results.txt 2>&1 || true
          done

      - name: Scan user-service
        run: |
          trivy image --severity HIGH,CRITICAL --no-progress --format sarif \
            --output reports/sarif-parts/user-service.sarif secureshop-user-service \
            || echo '{"version":"2.1.0","runs":[]}' > reports/sarif-parts/user-service.sarif

      - name: Upload SARIF - user-service
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/sarif-parts/user-service.sarif
          category: trivy-user-service

      - name: Scan product-service
        run: |
          trivy image --severity HIGH,CRITICAL --no-progress --format sarif \
            --output reports/sarif-parts/product-service.sarif secureshop-product-service \
            || echo '{"version":"2.1.0","runs":[]}' > reports/sarif-parts/product-service.sarif

      - name: Upload SARIF - product-service
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/sarif-parts/product-service.sarif
          category: trivy-product-service

      - name: Scan order-service
        run: |
          trivy image --severity HIGH,CRITICAL --no-progress --format sarif \
            --output reports/sarif-parts/order-service.sarif secureshop-order-service \
            || echo '{"version":"2.1.0","runs":[]}' > reports/sarif-parts/order-service.sarif

      - name: Upload SARIF - order-service
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/sarif-parts/order-service.sarif
          category: trivy-order-service

      - name: Scan payment-service
        run: |
          trivy image --severity HIGH,CRITICAL --no-progress --format sarif \
            --output reports/sarif-parts/payment-service.sarif secureshop-payment-service \
            || echo '{"version":"2.1.0","runs":[]}' > reports/sarif-parts/payment-service.sarif

      - name: Upload SARIF - payment-service
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/sarif-parts/payment-service.sarif
          category: trivy-payment-service

      - name: Scan notification-service
        run: |
          trivy image --severity HIGH,CRITICAL --no-progress --format sarif \
            --output reports/sarif-parts/notification-service.sarif secureshop-notification-service \
            || echo '{"version":"2.1.0","runs":[]}' > reports/sarif-parts/notification-service.sarif

      - name: Upload SARIF - notification-service
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/sarif-parts/notification-service.sarif
          category: trivy-notification-service

      - name: Scan inventory-service
        run: |
          trivy image --severity HIGH,CRITICAL --no-progress --format sarif \
            --output reports/sarif-parts/inventory-service.sarif secureshop-inventory-service \
            || echo '{"version":"2.1.0","runs":[]}' > reports/sarif-parts/inventory-service.sarif

      - name: Upload SARIF - inventory-service
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/sarif-parts/inventory-service.sarif
          category: trivy-inventory-service

      - name: Scan gateway
        run: |
          trivy image --severity HIGH,CRITICAL --no-progress --format sarif \
            --output reports/sarif-parts/gateway.sarif secureshop-gateway \
            || echo '{"version":"2.1.0","runs":[]}' > reports/sarif-parts/gateway.sarif

      - name: Upload SARIF - gateway
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/sarif-parts/gateway.sarif
          category: trivy-gateway

      - name: Upload all Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-results
          path: |
            reports/trivy-container-results.txt
            reports/sarif-parts/

  # =========================================================
  # IAC - CHECKOV
  # =========================================================
  iac-checkov:
    name: IaC Scan - Checkov
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Dockerfiles
        run: |
          mkdir -p reports
          echo "=== Dockerfile Scan ===" > reports/checkov-results.txt

          checkov --directory . --framework dockerfile --output cli >> reports/checkov-results.txt 2>&1 || true
          checkov --directory . --framework dockerfile --output sarif --output-file-path reports/ 2>/dev/null || true

          [ -f reports/results_sarif.sarif ] && mv reports/results_sarif.sarif reports/checkov-results.sarif
          [ -f reports/checkov-results.sarif ] || echo '{"version":"2.1.0","runs":[]}' > reports/checkov-results.sarif

      - name: Scan docker-compose
        run: |
          {
            echo ""
            echo "=== docker-compose Scan ==="
            checkov --file infrastructure/docker-compose.yml --framework yaml 2>&1 || true
          } >> reports/checkov-results.txt

      - name: Scan secrets in files
        run: |
          {
            echo ""
            echo "=== Secrets Scan ==="
            checkov --directory . --framework secrets 2>&1 || true
          } >> reports/checkov-results.txt

      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: |
            reports/checkov-results.txt
            reports/checkov-results.sarif

      - name: Upload Checkov SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/checkov-results.sarif
          category: checkov-iac

  # =========================================================
  # SAST - SEMGREP
  # =========================================================
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          mkdir -p reports

          semgrep scan \
            --config=p/security-audit \
            --config=p/python \
            --sarif \
            --output reports/semgrep-results.sarif \
            ./services || true

          semgrep scan \
            --config=p/security-audit \
            --config=p/python \
            --json \
            --output reports/semgrep-results.json \
            ./services || true

          [ -f reports/semgrep-results.sarif ] || echo '{"version":"2.1.0","runs":[]}' > reports/semgrep-results.sarif
          [ -f reports/semgrep-results.json ]  || echo '{"results":[],"errors":[]}' > reports/semgrep-results.json

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            reports/semgrep-results.sarif
            reports/semgrep-results.json

      - name: Upload Semgrep SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/semgrep-results.sarif
          category: semgrep-sast

  # =========================================================
  # DAST - ZAP
  # =========================================================
# ================= DAST =================
# =========================================================
  # DAST - ZAP
  # =========================================================
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [sast-semgrep, codeql]
    steps:
      - name: Upload ZAP Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            reports/zap-report.json
            reports/zap-report.md
      - name: Upload ZAP SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/zap-report.json
          category: zap-dast
      - name: Stop services
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down
  # =========================================================
  # SAST - CODEQL
  # =========================================================
  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # =========================================================
  # LINT - HADOLINT
  # =========================================================
  lint-hadolint:
    name: Linting - Hadolint (All Dockerfiles)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint on all services
        run: |
          mkdir -p reports
          echo "=== HADOLINT REPORT ===" > reports/hadolint-report.txt

          for file in $(find . -type f -name "Dockerfile"); do
            echo "" >> reports/hadolint-report.txt
            echo "=========================" >> reports/hadolint-report.txt
            echo "Scanning: $file" >> reports/hadolint-report.txt
            echo "=========================" >> reports/hadolint-report.txt

            docker run --rm -i hadolint/hadolint < "$file" >> reports/hadolint-report.txt || true
          done

      - name: Upload Hadolint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-report
          path: reports/hadolint-report.txt
