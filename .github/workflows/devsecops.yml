name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ================= SECRETS MANAGEMENT - VAULT =================
  secrets-vault:
    name: Secrets Management - Vault
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Start Vault (Dev Mode)
        run: |
          docker run -d --name vault-dev \
            --cap-add=IPC_LOCK \
            -e 'VAULT_DEV_ROOT_TOKEN_ID=secureshop-dev-token' \
            -p 8200:8200 \
            hashicorp/vault:1.15
          sleep 10
      
      - name: Verify Vault
        run: |
          export VAULT_ADDR='http://127.0.0.1:8200'
          vault status
      
      - name: Store Secrets
        run: |
          export VAULT_ADDR='http://127.0.0.1:8200'
          export VAULT_TOKEN='secureshop-dev-token'
          vault kv put secret/secureshop/test password=test123
          vault kv get secret/secureshop/test
      
      - name: Cleanup
        run: docker stop vault-dev && docker rm vault-dev