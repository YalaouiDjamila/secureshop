name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
# ================= SAST =================
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          mkdir -p reports
          bandit -r ./services -f sarif -o reports/bandit-results.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/bandit-results.sarif
          category: bandit
        continue-on-error: true


# ================= SCA =================
  sca-dependency-check:
    name: SCA - Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SecureShop'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 0
            --enableRetired

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/


# ================= Python SCA =================
  python-sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install dependencies
        run: |
          find . -name "requirements.txt" -exec pip install -r {} \; || true

      - name: Run pip-audit
        run: pip-audit || true


# ================= SECRET SCAN =================
  secrets-gitleaks:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ================= CONTAINER SCAN =================
  container-trivy:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f infrastructure/docker-compose.yml build

      - name: Scan user-service
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: infrastructure-user-service:latest
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Scan product-service
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: infrastructure-product-service:latest
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL


# ================= IaC =================
  iac-checkov:
    name: IaC Scan - Checkov
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: all
        continue-on-error: true


# ================= SBOM =================
  sbom:
    name: SBOM - Syft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          wget https://github.com/anchore/syft/releases/latest/download/syft_Linux_x86_64.tar.gz
          tar -xzf syft_Linux_x86_64.tar.gz
          sudo mv syft /usr/local/bin/

      - name: Generate SBOM
        run: syft dir:. -o json > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json


# ================= DAST =================
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [container-trivy]

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose -f infrastructure/docker-compose.yml up -d
          sleep 60

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost
        continue-on-error: true

      - name: Stop services
        run: docker compose -f infrastructure/docker-compose.yml down