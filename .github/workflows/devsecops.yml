name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ================= SBOM =================
  sbom:
    name: SBOM - Syft
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -Lo syft.tar.gz https://github.com/anchore/syft/releases/download/v1.0.0/syft_1.0.0_linux_amd64.tar.gz
          tar -xzf syft.tar.gz
          sudo mv syft /usr/local/bin/

      - name: Generate SBOM
        run: syft dir:. -o json > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json


  # ================= SAST =================
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit
        continue-on-error: true
        run: |
          mkdir -p reports
          bandit -r ./services -f json -o reports/bandit-results.json

      - name: Ensure Bandit report exists
        run: |
          if [ ! -f reports/bandit-results.json ]; then
            echo '{"results":[],"metrics":{}}' > reports/bandit-results.json
          fi

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: reports/bandit-results.json


  # ================= SCA - OWASP Dependency Check =================
  sca-dependency-check:
    name: SCA - Dependency Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SecureShop'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/


  # ================= SCA - pip-audit =================
  sca-pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on all services
        continue-on-error: true
        run: |
          mkdir -p reports
          for service in services/*/; do
            echo "=== Scanning $service ==="
            pip-audit -r "$service/requirements.txt" --format json 2>&1 || true
          done > reports/pip-audit-results.json

      - name: Ensure pip-audit report exists
        run: |
          if [ ! -f reports/pip-audit-results.json ]; then
            echo "[]" > reports/pip-audit-results.json
          fi

      - name: Upload pip-audit Report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: reports/pip-audit-results.json


  # ================= SECRET SCAN =================
  secrets-gitleaks:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -Lo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        continue-on-error: true
        run: |
          mkdir -p reports
          gitleaks detect --source . --no-git --report-format json --report-path reports/gitleaks-results.json --verbose || true

      - name: Ensure Gitleaks report exists
        run: |
          if [ ! -f reports/gitleaks-results.json ]; then
            echo "[]" > reports/gitleaks-results.json
          fi

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: reports/gitleaks-results.json


  # ================= CONTAINER SCAN =================
  container-trivy:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Build Docker images one by one
        continue-on-error: true
        run: |
          # Build each service individually so one failure doesn't stop all
          for svc in user-service product-service order-service payment-service notification-service inventory-service; do
            echo "=== Building $svc ==="
            docker build -t "secureshop-$svc" "services/$svc" || echo "FAILED to build $svc"
          done

      - name: Scan all images and save report
        continue-on-error: true
        run: |
          mkdir -p reports
          # Find any secureshop images that were successfully built
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "secureshop-" || true)
          echo "Images to scan: $IMAGES"
          if [ -z "$IMAGES" ]; then
            echo "No images found to scan" > reports/trivy-results.json
          else
            for img in $IMAGES; do
              echo "=== Scanning $img ==="
              trivy image --severity HIGH,CRITICAL --format table --no-progress "$img" 2>&1 || true
              echo "---" 
            done > reports/trivy-results.json
          fi

      - name: Ensure Trivy report exists
        run: |
          if [ ! -f reports/trivy-results.json ]; then
            echo "No images scanned" > reports/trivy-results.json
          fi

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: reports/trivy-results.json


  # ================= IaC =================
  iac-checkov:
    name: IaC Scan - Checkov
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on Dockerfiles
        continue-on-error: true
        run: |
          mkdir -p reports
          checkov -d . --framework dockerfile --output json > reports/checkov-dockerfile.json 2>&1 || true

      - name: Run Checkov on docker-compose
        continue-on-error: true
        run: |
          checkov -f infrastructure/docker-compose.yml --framework docker_compose --output json > reports/checkov-compose.json 2>&1 || true

      - name: Ensure Checkov reports exist
        run: |
          if [ ! -f reports/checkov-dockerfile.json ]; then
            echo "{}" > reports/checkov-dockerfile.json
          fi
          if [ ! -f reports/checkov-compose.json ]; then
            echo "{}" > reports/checkov-compose.json
          fi

      - name: Upload Checkov Reports
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: reports/checkov-*.json


  # ================= DAST =================
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [container-trivy]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        continue-on-error: true
        run: |
          docker compose -f infrastructure/docker-compose.yml up -d --build
          echo "Waiting for services to be ready..."
          for i in $(seq 1 12); do
            echo "Attempt $i/12..."
            if curl -s --fail http://localhost/products 2>/dev/null; then
              echo "Services are ready!"
              break
            fi
            sleep 5
          done
          docker compose -f infrastructure/docker-compose.yml ps

      - name: ZAP Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost'

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-results
          path: report_html.html

      - name: Stop services
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down
        