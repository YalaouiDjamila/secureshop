name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# ADD PERMISSIONS HERE
permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  # ========== SAST ==========
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Bandit
        run: pip install bandit
      
      - name: Run Bandit
        run: |
          bandit -r ./services -f sarif -o bandit-results.sarif || true
          ls -la bandit-results.sarif
        continue-on-error: true
      
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit
        continue-on-error: true

  # ========== SCA ==========
  sca-dependency-check:
    name: SCA - Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SecureShop'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 0
            --enableRetired
        continue-on-error: true
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
        continue-on-error: true

  # ========== SECRET SCANNING ==========
  secrets-gitleaks:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ========== CONTAINER SCANNING ==========
  container-trivy:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker images
        run: docker compose -f infrastructure/docker-compose.yml build
      
      - name: Run Trivy on user-service
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'infrastructure-user-service:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true
      
      - name: Run Trivy on product-service
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'infrastructure-product-service:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

  # ========== DAST ==========
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [container-trivy]
    steps:
      - uses: actions/checkout@v4
      
      - name: Start services
        run: |
          docker compose -f infrastructure/docker-compose.yml up -d
          sleep 30
          curl http://localhost/products || true
      
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost'
        continue-on-error: true
      
      - name: Stop services
        run: docker compose -f infrastructure/docker-compose.yml down