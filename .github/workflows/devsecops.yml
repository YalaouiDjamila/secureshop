name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

   # ================= SECRETS MANAGEMENT - VAULT =================
  secrets-vault:
    name: Secrets Management - Vault
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Start Vault Container
        run: |
          docker run -d --name vault-dev \
            --cap-add=IPC_LOCK \
            -e 'VAULT_DEV_ROOT_TOKEN_ID=secureshop-dev-token' \
            -e 'VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200' \
            -p 8200:8200 \
            hashicorp/vault:1.15
          sleep 10
          docker logs vault-dev
      
      - name: Test Vault API
        run: |
          curl -s http://127.0.0.1:8200/v1/sys/health | python3 -m json.tool
      
      - name: Store Secrets via API
        run: |
          curl -s \
            --header "X-Vault-Token: secureshop-dev-token" \
            --request POST \
            --data '{"data":{"password":"test123","key":"test-key"}}' \
            http://127.0.0.1:8200/v1/secret/data/secureshop/test
      
      - name: Retrieve Secrets via API
        run: |
          curl -s \
            --header "X-Vault-Token: secureshop-dev-token" \
            http://127.0.0.1:8200/v1/secret/data/secureshop/test | python3 -m json.tool
      
      - name: Cleanup
        if: always()
        run: docker stop vault-dev && docker rm vault-dev